<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universal AI Chat</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gemini: {
                            50: '#f0f4f9',
                            100: '#e1e5ea',
                            800: '#1e1f20', // Dark mode bg
                            900: '#131314', // Darker bg
                            blue: '#4c8bf5'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }

        /* Mobile Viewport Fix */
        body, html { height: 100dvh; overflow: hidden; }

        /* Loader */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 9999; display: flex;
            justify-content: center; align-items: center; flex-direction: column;
            transition: opacity 0.5s ease;
        }
        .dark #loading { background: #131314; color: white; }
        .spinner {
            border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px;
            border-radius: 50%; border-left-color: #4c8bf5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Markdown Styles */
        .prose pre { background-color: #1e1f20; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; color: #e2e8f0; }
        .prose code { background-color: rgba(0,0,0,0.05); padding: 0.2em 0.4em; border-radius: 0.25rem; font-size: 0.9em; }
        .dark .prose code { background-color: rgba(255,255,255,0.1); color: #e2e8f0; }
        .prose p { margin-bottom: 0.75rem; line-height: 1.6; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .prose ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        
        /* Message Bubbles */
        .msg-user { background-color: #f0f4f9; color: #1f2937; border-radius: 1.5rem 1.5rem 0 1.5rem; }
        .dark .msg-user { background-color: #2d2e30; color: #e2e8f0; }
        .msg-ai { background-color: transparent; color: #1f2937; width: 100%; }
        .dark .msg-ai { color: #e2e8f0; }
        
        /* Typing cursor */
        .cursor::after { content: '▋'; animation: blink 1s step-start infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* Sidebar Transition */
        #sidebar { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-white dark:bg-gemini-900 text-gray-800 dark:text-gray-100 font-sans antialiased selection:bg-blue-200 dark:selection:bg-blue-900">

    <div id="loading">
        <div class="spinner"></div>
        <p class="mt-4 text-sm font-medium text-gray-500 dark:text-gray-400">Initializing Core...</p>
    </div>

    <div class="flex h-full w-full relative">

        <aside id="sidebar" class="absolute z-40 md:static inset-y-0 left-0 w-72 bg-gray-50 dark:bg-gemini-800 border-r border-gray-200 dark:border-gray-700 transform -translate-x-full md:translate-x-0 flex flex-col h-full">
            
            <div class="p-4 flex items-center justify-between shrink-0">
                <button onclick="app.createNewChat()" class="flex-1 flex items-center gap-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 px-4 py-3 rounded-full transition-colors text-sm font-medium">
                    <i class="fa-solid fa-plus text-gemini-blue"></i>
                    <span>New Chat</span>
                </button>
                <button onclick="ui.toggleSidebar()" class="md:hidden ml-2 p-2 text-gray-500 hover:bg-gray-200 dark:hover:bg-gray-700 rounded-full">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto px-2 py-2 space-y-1" id="chat-history-list">
                </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700 shrink-0">
                <div class="flex flex-col gap-2">
                     <button onclick="ui.openSettings()" class="flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors w-full text-left">
                        <i class="fa-solid fa-gear"></i> Settings
                    </button>
                    <button onclick="app.toggleDarkMode()" class="flex items-center gap-3 px-3 py-2 text-sm rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors w-full text-left">
                        <i id="theme-icon" class="fa-solid fa-moon"></i> <span id="theme-text">Dark Mode</span>
                    </button>
                </div>
            </div>
        </aside>

        <div id="sidebar-overlay" onclick="ui.toggleSidebar()" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden glass"></div>

        <main class="flex-1 flex flex-col h-full relative w-full min-w-0">
            
            <header class="flex items-center justify-between px-4 py-3 shrink-0 bg-white dark:bg-gemini-900 z-10">
                <div class="flex items-center gap-3">
                    <button onclick="ui.toggleSidebar()" class="md:hidden p-2 -ml-2 text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-full">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <div class="flex flex-col cursor-pointer" onclick="ui.openSettings()">
                        <span class="font-medium text-lg leading-tight flex items-center gap-2">
                            Gemini Clone <span class="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded dark:bg-blue-900 dark:text-blue-200" id="current-model-display">DeepSeek</span>
                        </span>
                    </div>
                </div>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
                <div id="welcome-screen" class="h-full flex flex-col items-center justify-center text-center opacity-100 transition-opacity duration-300">
                    <div class="w-16 h-16 bg-gradient-to-tr from-blue-400 to-red-400 rounded-2xl mb-6 blur-sm opacity-80 animate-pulse"></div>
                    <h1 class="text-3xl md:text-4xl font-semibold bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent mb-2">Hello, User</h1>
                    <p class="text-gray-500 dark:text-gray-400 text-lg">How can I help you today?</p>
                </div>
                </div>

            <div class="p-4 shrink-0 w-full max-w-4xl mx-auto">
                <div class="relative bg-gray-100 dark:bg-gemini-800 rounded-3xl flex items-end p-2 border border-transparent focus-within:border-gray-300 dark:focus-within:border-gray-600 focus-within:bg-white dark:focus-within:bg-gemini-800 transition-all shadow-sm">
                    <button class="p-3 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 rounded-full shrink-0">
                        <i class="fa-solid fa-circle-plus text-xl"></i>
                    </button>
                    <textarea id="user-input" rows="1" class="w-full bg-transparent border-none focus:ring-0 resize-none py-3 px-2 max-h-32 text-gray-800 dark:text-gray-100 placeholder-gray-500" placeholder="Type a message..." oninput="ui.autoResize(this)" onkeydown="ui.handleEnter(event)"></textarea>
                    <button id="send-btn" onclick="app.sendMessage()" class="p-3 text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 rounded-full shrink-0 transition-colors">
                        <i class="fa-solid fa-paper-plane text-xl"></i>
                    </button>
                </div>
                <div class="text-center mt-2">
                    <p class="text-xs text-gray-400 dark:text-gray-500">AI can make mistakes. Check important info.</p>
                </div>
            </div>
        </main>

    </div>

    <div id="settings-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-gemini-800 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
                <h2 class="text-lg font-semibold">Settings</h2>
                <button onclick="ui.closeSettings()" class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4">
                
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">OpenRouter API Key <span class="text-red-500">*</span></label>
                    <input type="password" id="setting-api-key" placeholder="sk-or-..." class="w-full p-3 rounded-lg bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                    <p class="text-xs text-gray-500 mt-1">Key is stored locally in your browser.</p>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">Model Name</label>
                    <input type="text" id="setting-model" value="deepseek/deepseek-r1:free" class="w-full p-3 rounded-lg bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">System Prompt</label>
                    <textarea id="setting-system-prompt" rows="3" class="w-full p-3 rounded-lg bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="You are a helpful assistant..."></textarea>
                </div>

                <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
                    <button onclick="app.clearData()" class="text-red-500 text-sm hover:underline"><i class="fa-solid fa-trash"></i> Wipe All Data</button>
                </div>
            </div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 flex justify-end">
                <button onclick="app.saveSettings()" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-full font-medium transition-colors">Save</button>
            </div>
        </div>
    </div>

    <div id="rename-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-gemini-800 w-full max-w-sm rounded-2xl shadow-xl p-6">
            <h3 class="text-lg font-semibold mb-4">Rename Chat</h3>
            <input type="text" id="rename-input" class="w-full p-3 rounded-lg bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 focus:ring-2 focus:ring-blue-500 outline-none mb-4">
            <div class="flex justify-end gap-2">
                <button onclick="document.getElementById('rename-modal').classList.add('hidden')" class="px-4 py-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">Cancel</button>
                <button onclick="app.confirmRename()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Rename</button>
            </div>
        </div>
    </div>

    <script>
        /**
         * CORE STATE MANAGEMENT
         */
        const state = {
            chats: [],
            currentChatId: null,
            settings: {
                apiKey: "",
                model: "deepseek/deepseek-r1:free",
                systemPrompt: "You are a helpful AI assistant.",
                darkMode: false
            },
            isGenerating: false,
            abortController: null
        };

        const STORAGE_KEY = "universal_chat_data";

        /**
         * DOM HELPERS & UI CONTROLLER
         */
        const $ = (selector) => document.querySelector(selector);
        
        const ui = {
            toggleSidebar: () => {
                const sb = $('#sidebar');
                const overlay = $('#sidebar-overlay');
                if (sb.classList.contains('-translate-x-full')) {
                    sb.classList.remove('-translate-x-full'); // Open
                    overlay.classList.remove('hidden');
                } else {
                    sb.classList.add('-translate-x-full'); // Close
                    overlay.classList.add('hidden');
                }
            },
            autoResize: (el) => {
                el.style.height = 'auto';
                el.style.height = el.scrollHeight + 'px';
            },
            handleEnter: (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if(state.isGenerating) return;
                    app.sendMessage();
                }
            },
            scrollToBottom: () => {
                const container = $('#chat-container');
                container.scrollTop = container.scrollHeight;
            },
            openSettings: () => {
                $('#setting-api-key').value = state.settings.apiKey || '';
                $('#setting-model').value = state.settings.model;
                $('#setting-system-prompt').value = state.settings.systemPrompt;
                $('#settings-modal').classList.remove('hidden');
            },
            closeSettings: () => $('#settings-modal').classList.add('hidden'),
            showLoader: (show) => {
                const loader = $('#loading');
                if(!show) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                } else {
                    loader.style.display = 'flex';
                    loader.style.opacity = '1';
                }
            },
            updateThemeIcon: () => {
                const isDark = document.documentElement.classList.contains('dark');
                $('#theme-icon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
                $('#theme-text').textContent = isDark ? 'Light Mode' : 'Dark Mode';
            }
        };

        /**
         * APP LOGIC
         */
        const app = {
            init: () => {
                app.loadState();
                app.applyTheme();
                app.renderChatHistory();
                
                // If no chats, create one
                if (state.chats.length === 0) {
                    app.createNewChat();
                } else {
                    // Load most recent
                    app.loadChat(state.chats[0].id);
                }

                // Hide loader
                ui.showLoader(false);
            },

            loadState: () => {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    state.chats = parsed.chats || [];
                    state.settings = { ...state.settings, ...parsed.settings };
                }
            },

            saveState: () => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    chats: state.chats,
                    settings: state.settings
                }));
            },

            applyTheme: () => {
                if (state.settings.darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                ui.updateThemeIcon();
            },

            toggleDarkMode: () => {
                state.settings.darkMode = !state.settings.darkMode;
                app.applyTheme();
                app.saveState();
            },

            saveSettings: () => {
                state.settings.apiKey = $('#setting-api-key').value.trim();
                state.settings.model = $('#setting-model').value.trim();
                state.settings.systemPrompt = $('#setting-system-prompt').value.trim();
                app.saveState();
                ui.closeSettings();
                $('#current-model-display').textContent = state.settings.model.split('/')[1] || state.settings.model;
            },

            createNewChat: () => {
                const newChat = {
                    id: Date.now().toString(),
                    title: "New Chat",
                    messages: [],
                    systemPrompt: state.settings.systemPrompt, // Snapshot current system prompt
                    createdAt: Date.now()
                };
                state.chats.unshift(newChat);
                app.saveState();
                app.renderChatHistory();
                app.loadChat(newChat.id);
                // On mobile, close sidebar after creating new chat
                if(window.innerWidth < 768) ui.toggleSidebar();
            },

            loadChat: (id) => {
                state.currentChatId = id;
                const chat = state.chats.find(c => c.id === id);
                if (!chat) return;

                // Update UI active state
                document.querySelectorAll('.chat-item').forEach(el => {
                    el.classList.remove('bg-gray-200', 'dark:bg-gray-700');
                    if (el.dataset.id === id) el.classList.add('bg-gray-200', 'dark:bg-gray-700');
                });

                // Render Messages
                const container = $('#chat-container');
                container.innerHTML = ''; // Clear
                
                if (chat.messages.length === 0) {
                    $('#welcome-screen').style.display = 'flex';
                    container.appendChild($('#welcome-screen'));
                } else {
                    $('#welcome-screen').style.display = 'none';
                    chat.messages.forEach(msg => app.appendMessageToDOM(msg.role, msg.content));
                }
                ui.scrollToBottom();
            },

            renderChatHistory: () => {
                const list = $('#chat-history-list');
                list.innerHTML = '';
                state.chats.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = `chat-item group flex items-center justify-between p-3 rounded-full cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors ${state.currentChatId === chat.id ? 'bg-gray-200 dark:bg-gray-700' : ''}`;
                    div.dataset.id = chat.id;
                    div.onclick = (e) => {
                        // Prevent click if clicking actions
                        if(e.target.closest('.actions')) return;
                        app.loadChat(chat.id);
                        if(window.innerWidth < 768) ui.toggleSidebar();
                    };

                    div.innerHTML = `
                        <div class="flex items-center gap-3 overflow-hidden">
                            <i class="fa-regular fa-message text-gray-500"></i>
                            <span class="truncate text-sm text-gray-700 dark:text-gray-300 select-none">${chat.title}</span>
                        </div>
                        <div class="actions hidden group-hover:flex items-center gap-2">
                            <button onclick="app.openRename('${chat.id}')" class="text-gray-400 hover:text-blue-500"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="app.deleteChat('${chat.id}')" class="text-gray-400 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            },

            deleteChat: (id) => {
                if(!confirm("Delete this chat?")) return;
                state.chats = state.chats.filter(c => c.id !== id);
                app.saveState();
                app.renderChatHistory();
                if (state.currentChatId === id) {
                    state.chats.length > 0 ? app.loadChat(state.chats[0].id) : app.createNewChat();
                }
            },

            openRename: (id) => {
                const chat = state.chats.find(c => c.id === id);
                if(!chat) return;
                window.renameTargetId = id;
                $('#rename-input').value = chat.title;
                $('#rename-modal').classList.remove('hidden');
            },

            confirmRename: () => {
                const id = window.renameTargetId;
                const newTitle = $('#rename-input').value.trim();
                if(newTitle) {
                    const chat = state.chats.find(c => c.id === id);
                    if(chat) {
                        chat.title = newTitle;
                        app.saveState();
                        app.renderChatHistory();
                    }
                }
                $('#rename-modal').classList.add('hidden');
            },

            clearData: () => {
                if(confirm("This will delete ALL chats and settings. Are you sure?")) {
                    localStorage.removeItem(STORAGE_KEY);
                    location.reload();
                }
            },

            appendMessageToDOM: (role, content, isStreaming = false) => {
                const container = $('#chat-container');
                const isAI = role === 'assistant';
                
                // If it's the first message, hide welcome
                $('#welcome-screen').style.display = 'none';

                let msgDiv = document.createElement('div');
                msgDiv.className = `flex w-full mb-6 ${isAI ? 'justify-start' : 'justify-end'}`;
                
                // Unique ID for streaming updates
                const msgId = `msg-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                
                // Icon for AI
                const avatar = isAI 
                    ? `<div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center shrink-0 mr-3 mt-1 shadow-lg"><i class="fa-solid fa-sparkles text-white text-xs"></i></div>`
                    : ``;

                const contentHtml = isAI ? app.renderMarkdown(content) : content;

                msgDiv.innerHTML = `
                    ${avatar}
                    <div class="max-w-[85%] md:max-w-[75%] ${isAI ? 'msg-ai' : 'msg-user px-5 py-3 shadow-sm'}">
                        <div id="${msgId}" class="prose dark:prose-invert max-w-none text-sm md:text-base leading-relaxed break-words ${isStreaming ? 'cursor' : ''}">
                            ${contentHtml}
                        </div>
                    </div>
                `;

                container.appendChild(msgDiv);
                ui.scrollToBottom();
                return msgId; // Return ID to update content if streaming
            },

            renderMarkdown: (text) => {
                // Configure marked options
                marked.setOptions({
                    breaks: true, // Convert \n to <br>
                    gfm: true     // GitHub Flavored Markdown
                });
                const rawHtml = marked.parse(text);
                return DOMPurify.sanitize(rawHtml);
            },

            sendMessage: async () => {
                const input = $('#user-input');
                const text = input.value.trim();
                
                if (!text) return;
                if (!state.settings.apiKey) {
                    alert("Please enter your OpenRouter API Key in Settings.");
                    ui.openSettings();
                    return;
                }

                // UI Reset
                input.value = '';
                input.style.height = 'auto';
                state.isGenerating = true;
                $('#send-btn').innerHTML = '<i class="fa-solid fa-stop animate-pulse text-red-500"></i>';
                $('#send-btn').onclick = app.abortGeneration;

                // 1. Add User Message
                const currentChat = state.chats.find(c => c.id === state.currentChatId);
                currentChat.messages.push({ role: 'user', content: text });
                app.appendMessageToDOM('user', text);
                app.saveState();

                // 2. Prepare AI Message Container
                const aiMsgId = app.appendMessageToDOM('assistant', '', true); // Empty initially, cursor on
                const aiContentDiv = document.getElementById(aiMsgId);
                let fullAiResponse = "";

                // 3. API Request
                state.abortController = new AbortController();
                
                try {
                    const messagesPayload = [
                        { role: 'system', content: currentChat.systemPrompt || state.settings.systemPrompt },
                        ...currentChat.messages.map(m => ({ role: m.role, content: m.content }))
                    ];

                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${state.settings.apiKey}`,
                            "HTTP-Referer": window.location.href,
                            "X-Title": "Universal AI Chat",
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: state.settings.model,
                            messages: messagesPayload,
                            stream: true
                        }),
                        signal: state.abortController.signal
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || "API Error");
                    }

                    // 4. Stream Handling
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6);
                                if (dataStr === '[DONE]') continue;
                                try {
                                    const json = JSON.parse(dataStr);
                                    const delta = json.choices[0]?.delta?.content || "";
                                    fullAiResponse += delta;
                                    
                                    // Live Render (raw text during stream for perf, markdown later or periodically)
                                    // For best UX + Safety: Render Markdown on every chunk is heavy but looks best. 
                                    // Optimization: Render every X characters or raw append.
                                    // We will use raw render for streaming + markdown parse
                                    aiContentDiv.innerHTML = app.renderMarkdown(fullAiResponse);
                                    ui.scrollToBottom();

                                } catch (e) {
                                    console.error("Parse error", e);
                                }
                            }
                        }
                    }

                    // 5. Finalize
                    currentChat.messages.push({ role: 'assistant', content: fullAiResponse });
                    
                    // Auto-rename chat if it's the first message and title is "New Chat"
                    if (currentChat.messages.length === 2 && currentChat.title === "New Chat") {
                        app.generateTitle(text, fullAiResponse, currentChat.id);
                    }

                    app.saveState();

                } catch (error) {
                    if (error.name === 'AbortError') {
                        aiContentDiv.innerHTML += " <span class='text-red-400'>[Stopped]</span>";
                    } else {
                        aiContentDiv.innerHTML += `<div class="text-red-500 mt-2 p-2 bg-red-50 rounded border border-red-200">Error: ${error.message}</div>`;
                    }
                } finally {
                    state.isGenerating = false;
                    state.abortController = null;
                    aiContentDiv.classList.remove('cursor'); // Remove cursor
                    $('#send-btn').innerHTML = '<i class="fa-solid fa-paper-plane text-xl"></i>';
                    $('#send-btn').onclick = app.sendMessage;
                }
            },

            abortGeneration: () => {
                if (state.abortController) {
                    state.abortController.abort();
                }
            },

            generateTitle: async (userMsg, aiMsg, chatId) => {
                // Simple heuristic or separate API call (skipping API call to save tokens/complexity, strictly logic based)
                // Let's just take the first 30 chars of user message for now to keep it zero-build fast
                const chat = state.chats.find(c => c.id === chatId);
                if(chat) {
                    chat.title = userMsg.substring(0, 30) + (userMsg.length > 30 ? "..." : "");
                    app.saveState();
                    app.renderChatHistory();
                }
            }
        };

        // Initialize
        window.onload = app.init;

    </script>
</body>
</html>
