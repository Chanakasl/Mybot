<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUBR Verification System</title>

    <!-- Adsterra Ad Script Included -->
    <script src="https://pl31185367.profitableratecpmnetwork.com/dd/06/4d/dd064d5d24bf6cf3bddd50f6d205dfe3.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; text-align: center; padding: 20px; margin: 0; }
        .container { background: #ffffff; max-width: 420px; margin: 30px auto; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .ad-space { background: #fafafa; padding: 20px 10px; margin: 20px 0; border: 2px dashed #e0e0e0; border-radius: 12px; color: #777; font-size: 14px; }
        .timer-box { background: #1e293b; color: #ffffff; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .time { font-size: 48px; font-weight: 800; margin: 8px 0; color: #38bdf8; }
        .btn { background: #22c55e; color: #ffffff; border: none; padding: 16px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; display: none; width: 100%; box-shadow: 0 4px 12px rgba(34,197,94,0.3); transition: all 0.2s; }
        .btn:hover { background: #16a34a; }
        .step-text { color: #0f172a; font-weight: 700; font-size: 20px; margin-bottom: 8px; }
        p { color: #64748b; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <div class="step-text" id="stepText">Step 1 of 3</div>
    <p>Please wait while the page loads. The button will activate when the timer ends.</p>

    <!-- Adsterra Banner Container -->
    <div class="ad-space">
        📢 <b>Advertisement</b>
        <div id="container-dd064d5d24bf6cf3bddd50f6d205dfe3"></div>
    </div>

    <div class="timer-box" id="timerBox">
        <div style="font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8;">Next step in</div>
        <div class="time" id="countdown">6</div>
        <div style="font-size: 12px; color: #94a3b8;">seconds</div>
    </div>

    <button class="btn" id="continueBtn" onclick="nextStep()">Continue ➔</button>
</div>

<script>
    let currentStep = 1;
    let timerInterval;

    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('uid');
    const BOT_USERNAME = "get_Blog_bot"; 

    function startTimer() {
        let timeLeft = 6;
        document.getElementById('countdown').innerText = timeLeft;
        document.getElementById('timerBox').style.display = 'block';
        document.getElementById('continueBtn').style.display = 'none';

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timerBox').style.display = 'none';
                document.getElementById('continueBtn').style.display = 'block';
                
                if(currentStep === 3) {
                    document.getElementById('continueBtn').innerText = "Verify Access ➔";
                }
            }
        }, 1000);
    }

    function nextStep() {
        if (currentStep < 3) {
            currentStep++;
            document.getElementById('stepText').innerText = `Step ${currentStep} of 3`;
            startTimer();
        } else {
            document.getElementById('stepText').innerText = "Verification Complete!";
            document.getElementById('continueBtn').innerText = "Redirecting to Bot...";
            
            // Redirect back to bot with successful token
            window.location.href = `https://t.me/${BOT_USERNAME}?start=success_${userId}`;
        }
    }

    window.onload = startTimer;
</script>

</body>
</html>
