<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WUBR Verification</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f5f5f5; text-align: center; padding: 20px; margin: 0; }
        .container { background: white; max-width: 400px; margin: 20px auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .ad-space { background: #eee; padding: 40px 10px; margin: 20px 0; border: 1px dashed #ccc; border-radius: 8px; color: #666; }
        .timer-box { background: #333; color: white; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .time { font-size: 40px; font-weight: bold; margin: 10px 0; }
        .btn { background: #4CAF50; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 6px; cursor: pointer; display: none; width: 100%; }
        .step-text { color: #555; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Verification</h2>
    <p class="step-text" id="stepText">Step 1 of 3</p>
    <p>Please wait while the ad loads. The button will activate when the timer ends.</p>

    <!-- ඔයාගේ Adsterra හෝ වෙනත් Ad network එකේ Ads මෙතනට දාන්න පුළුවන් -->
    <div class="ad-space">
        📢 Advertisement Space Ready<br><small>Test Mode</small>
    </div>

    <div class="timer-box" id="timerBox">
        <div style="font-size: 14px; text-transform: uppercase;">Next step in</div>
        <div class="time" id="countdown">6</div>
        <div style="font-size: 12px; color: #aaa;">seconds</div>
    </div>

    <button class="btn" id="continueBtn" onclick="nextStep()">Continue ➔</button>
</div>

<script>
    let currentStep = 1;
    let timerInterval;

    // URL එකෙන් User ගේ ID එක සහ Bot ගේ Username එක ගන්නවා
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('uid');
    
    // ⚠️ ඔයාගේ Bot ගේ Username එක මෙතන දෙන්න (@ ලකුණ නැතිව)
    const BOT_USERNAME = "get_Blog_bot"; 

    function startTimer() {
        let timeLeft = 6;
        document.getElementById('countdown').innerText = timeLeft;
        document.getElementById('timerBox').style.display = 'block';
        document.getElementById('continueBtn').style.display = 'none';

        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('countdown').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timerBox').style.display = 'none';
                document.getElementById('continueBtn').style.display = 'block';
                
                if(currentStep === 3) {
                    document.getElementById('continueBtn').innerText = "Open Telegram";
                }
            }
        }, 1000);
    }

    function nextStep() {
        if (currentStep < 3) {
            currentStep++;
            document.getElementById('stepText').innerText = `Step ${currentStep} of 3`;
            startTimer();
        } else {
            // Final Step - Telegram Bot වෙත ආපසු යැවීම
            document.getElementById('stepText').innerText = "Verification Complete!";
            document.getElementById('continueBtn').innerText = "Redirecting...";
            
            // Bot වෙත payload එක යැවීම
            window.location.href = `tg://resolve?domain=${BOT_USERNAME}&start=success_${userId}`;
        }
    }

    // පිටුව ලෝඩ් වූ විට පළමු Timer එක පටන් ගැනීම
    window.onload = startTimer;
</script>

</body>
</html>
